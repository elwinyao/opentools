<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💉</text></svg>">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.sheetjs.com; connect-src 'self' https://jdlyqpvvfmsesdlicdbp.supabase.co wss://jdlyqpvvfmsesdlicdbp.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<link rel="preconnect" href="https://jdlyqpvvfmsesdlicdbp.supabase.co">
<link rel="dns-prefetch" href="https://jdlyqpvvfmsesdlicdbp.supabase.co">
<link rel="preload" href="../lib/supabase-js.min.js" as="script">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="疫苗接种">
<meta name="theme-color" content="#4472C4">
<link rel="manifest" href="../manifest.json">
<title>💉 宝宝疫苗接种</title>

<link rel="stylesheet" href="../lib/common.css">
<link rel="stylesheet" href="vaccine-tracker.css">
</head>
<body>

<div class="header">
  <h1>💉 宝宝疫苗接种</h1>
  <div class="month-display">
    <span id="monthDisplayText"></span>
    <button class="logout-link" id="loginLink" data-action="login">登录</button>
    <button class="logout-link" id="logoutLink" data-action="logout" style="display:none">退出登录</button>
  </div>
  <div class="sync-status" id="syncStatus">
    <span class="sync-dot offline"></span>
    <span id="syncText">未登录</span>
  </div>
</div>

<div class="container">
  <!-- 统计栏 -->
  <div class="stats-bar" id="vaccineStats"></div>

  <!-- 工具栏 -->
  <div class="toolbar">
    <div class="filter-bar">
      <button class="filter-btn active" data-action="filter" data-filter="all">全部</button>
      <button class="filter-btn" data-action="filter" data-filter="pending">未接种</button>
      <button class="filter-btn" data-action="filter" data-filter="done">已接种</button>
      <button class="filter-btn" data-action="filter" data-filter="skipped">已跳过</button>
    </div>
    <div class="toolbar-btns">
      <button class="btn-add-custom" data-action="open-custom-modal">➕ 添加疫苗</button>
      <button class="btn-restore" data-action="restore-builtin">↩ 恢复内置</button>
    </div>
  </div>

  <!-- 疫苗列表 -->
  <div class="vaccine-list" id="vaccineList"></div>

  <!-- 导出栏 -->
  <div class="export-bar">
    <button class="btn-export" data-action="export-json">📤 导出数据</button>
    <button class="btn-primary" data-action="import-json" style="background:#5B9BD5;">📥 导入数据</button>
    <input type="file" id="importFile" accept=".json" style="display:none">
  </div>
</div>

<!-- 接种记录编辑弹窗 -->
<div class="modal-overlay" id="vaccineModal">
  <div class="modal-box">
    <h2 id="vaccineModalTitle">登记接种</h2>
    <div class="vaccine-modal-info" id="vaccineModalInfo"></div>

    <!-- 疫苗信息编辑区 -->
    <div class="modal-section-title">📋 疫苗信息</div>
    <div class="modal-form">
      <div class="modal-row">
        <label>疫苗名称：</label>
        <input type="text" id="editVaccineName" placeholder="疫苗名称">
      </div>
      <div class="modal-row">
        <label>第几剂：</label>
        <input type="number" id="editDoseNumber" min="1" max="10" step="1">
        <label class="label-secondary">建议月龄：</label>
        <input type="number" id="editScheduleMonths" min="0" max="120" step="1">
        <label class="label-secondary">月</label>
      </div>
      <div class="modal-row">
        <label>月龄描述：</label>
        <input type="text" id="editScheduleAge" placeholder="如 6月龄">
      </div>
      <div class="modal-row">
        <label>预防疾病：</label>
        <input type="text" id="editDisease" placeholder="如 乙型病毒性肝炎">
      </div>
    </div>

    <!-- 接种信息区 -->
    <div class="modal-section-title">💉 接种信息</div>
    <div class="modal-form">
      <div class="modal-row">
        <label>状态：</label>
        <select id="vaccineStatusSelect">
          <option value="pending">⏳ 未接种</option>
          <option value="done">✅ 已接种</option>
          <option value="skipped">⏭️ 已跳过</option>
        </select>
      </div>
      <div class="modal-row">
        <label>接种日期：</label>
        <input type="date" id="vaccinatedDate">
      </div>
      <div class="modal-row">
        <label>疫苗批号：</label>
        <input type="text" id="lotNumber" placeholder="可选">
      </div>
      <div class="modal-row">
        <label>接种机构：</label>
        <input type="text" id="hospital" placeholder="可选">
      </div>
      <div class="modal-row">
        <label>备注：</label>
        <input type="text" id="vaccineNote" placeholder="可选">
      </div>
    </div>

    <div class="modal-btns" id="vaccineModalBtns">
      <button class="btn-cancel" data-action="vaccine-modal-cancel">取消</button>
      <button class="btn-save" data-action="vaccine-modal-save">💾 保存</button>
    </div>
  </div>
</div>

<!-- 添加疫苗弹窗 -->
<div class="modal-overlay" id="customVaccineModal">
  <div class="modal-box">
    <h2>➕ 添加疫苗</h2>
    <div class="custom-vaccine-section">
      <label class="section-label">快速选择常用疫苗：</label>
      <div class="preset-grid" id="presetGrid"></div>
    </div>
    <div class="modal-divider"><span>或自定义</span></div>
    <div class="modal-form">
      <div class="modal-row">
        <label>疫苗名称：</label>
        <input type="text" id="customVaccineName" placeholder="如 手足口疫苗">
      </div>
      <div class="modal-row">
        <label>第几剂：</label>
        <input type="number" id="customDoseNumber" min="1" max="10" step="1" value="1">
      </div>
      <div class="modal-row">
        <label>建议月龄：</label>
        <input type="number" id="customScheduleMonthsInput" min="0" max="120" step="1" placeholder="如 6">
        <label class="label-secondary">月</label>
      </div>
      <div class="modal-row">
        <label>月龄描述：</label>
        <input type="text" id="customScheduleAgeInput" placeholder="如 6月龄">
      </div>
      <div class="modal-row">
        <label>预防疾病：</label>
        <input type="text" id="customDisease" placeholder="如 手足口病">
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" data-action="custom-modal-cancel">取消</button>
      <button class="btn-save" data-action="custom-modal-save">添加</button>
    </div>
  </div>
</div>

<!-- 登录弹窗容器 -->
<div id="loginModalContainer" data-sub="登录后可在多设备同步疫苗接种记录"></div>

<script src="../lib/common-bundle.js?v=2.29d"></script>
<script src="vaccine-tracker.js?v=2"></script>
</body>
</html>
