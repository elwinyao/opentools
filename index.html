<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.sheetjs.com; connect-src 'self' https://jdlyqpvvfmsesdlicdbp.supabase.co wss://jdlyqpvvfmsesdlicdbp.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

<div class="header">
  <h1>🍼 宝宝成长助手</h1>
  <div class="user-info" id="userInfo">
    <span id="userDisplay">📱 未登录</span>
    <button id="headerLoginBtn" data-action="login">登录</button>
    <button id="logoutBtn" data-action="logout" style="display:none">退出登录</button>
  </div>
</div>

<div class="container">
  <div class="welcome-card">
    <div class="welcome-icon">👶</div>
    <h2>欢迎使用宝宝成长助手</h2>
    <p>记录宝宝日常作息</p>
  </div>

  <div class="entry-grid">
    <!-- 作息记录 -->
    <a href="baby-tracker/baby-tracker.html" class="entry-card card-baby">
      <div class="entry-icon">⏱️</div>
      <div class="entry-title">作息记录</div>
      <div class="entry-desc">记录喝奶、睡眠、玩耍、洗护等日常作息，查看时间轴与月度汇总</div>
    </a>
    <!-- 成长记录 -->
    <a href="growth-tracker/growth-tracker.html" class="entry-card card-growth">
      <div class="entry-icon">📏</div>
      <div class="entry-title">成长记录</div>
      <div class="entry-desc">记录宝宝月龄（区分出生日/预产期）、身高体重，查看成长趋势</div>
    </a>
    <!-- 疫苗接种 -->
    <a href="vaccine-tracker/vaccine-tracker.html" class="entry-card card-vaccine">
      <div class="entry-icon">💉</div>
      <div class="entry-title">疫苗接种</div>
      <div class="entry-desc">按国家免疫规划跟踪疫苗进度，记录接种日期、批号与备注</div>
    </a>
  </div>
</div>

<!-- 登录弹窗容器（兼容 iOS / 微信环境） -->
<div id="loginModalContainer" data-sub="登录后可在多设备同步数据"></div>

<!-- 公共库放在底部，避免阻塞 DOM 解析 -->
<script src="lib/common-bundle.js?v=2.41"></script>
<script src="index.js"></script>

</html>
