<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="成长助手">
<meta name="theme-color" content="#4472C4">
<link rel="manifest" href="manifest.json">
<title>🍼 宝宝成长助手</title>
<!-- 公共库 -->
<script src="lib/app-namespace.js"></script>
<script src="lib/logger.js"></script>
<script src="lib/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lib/supabase-client.js"></script>
<script src="lib/crypto-utils.js"></script>
<script src="lib/supabase-auth.js"></script>
<script src="lib/storage.js"></script>
<script src="lib/utils.js"></script>
<link rel="stylesheet" href="lib/common.css">
<link rel="stylesheet" href="index.css">
</head>
<body>

<div class="header">
  <h1>🍼 宝宝成长助手</h1>
  <div class="user-info" id="userInfo">
    <span id="userDisplay">📱 未登录</span>
    <button id="loginBtn" onclick="showLogin()">登录</button>
    <button id="logoutBtn" onclick="logout()" style="display:none">退出登录</button>
  </div>
</div>

<div class="container">
  <div class="welcome-card">
    <div class="welcome-icon">👶</div>
    <h2>欢迎使用宝宝成长助手</h2>
    <p>一站式记录宝宝日常作息，支持多设备云端同步</p>
  </div>

  <div class="entry-grid">
    <!-- 作息记录 -->
    <a href="baby-tracker/baby-tracker.html" class="entry-card card-baby">
      <div class="entry-icon">⏱️</div>
      <div class="entry-title">作息记录</div>
      <div class="entry-desc">记录喝奶、睡眠、玩耍、洗护等日常作息，查看时间轴与月度汇总</div>
    </a>
  </div>
</div>

<!-- 登录弹窗 -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-box">
    <h2>🍼 欢迎使用</h2>
    <div class="modal-sub">登录后可在多设备同步数据</div>
    <input type="email" id="loginEmail" placeholder="邮箱地址">
    <input type="password" id="loginPassword" placeholder="密码（至少6位）">
    <div class="modal-error" id="loginError"></div>
    <button class="btn-block btn-login" onclick="handleLogin()">🔑 登录</button>
    <button class="btn-block btn-signup" onclick="handleSignup()">✨ 注册新账号</button>
    <div class="modal-divider">或</div>
    <button class="btn-block btn-skip" onclick="skipLogin()">📱 仅本设备使用（不同步）</button>
  </div>
</div>

<script>
// ==================== 入口页面逻辑 ====================

// ==================== UI 状态 ====================
function setUserDisplay(email) {
  document.getElementById('userDisplay').textContent = '👤 ' + email;
  document.getElementById('loginBtn').style.display = 'none';
  document.getElementById('logoutBtn').style.display = 'inline-block';
}

function clearUserDisplay() {
  document.getElementById('userDisplay').textContent = '📱 未登录';
  document.getElementById('loginBtn').style.display = 'inline-block';
  document.getElementById('logoutBtn').style.display = 'none';
}

function updateSyncStatus(status) {
  var el = document.getElementById('userDisplay');
  if (el && App.currentUser) {
    if (status === 'online') el.textContent = '👤 ' + App.currentUser.email;
    else if (status === 'syncing') el.textContent = '⏳ 同步中...';
    else el.textContent = '👤 ' + App.currentUser.email + ' (离线)';
  }
}

// ==================== 登录成功回调 ====================
async function onLoginSuccess(user, session) {
  App.currentUser.loginAt = Date.now();
  await saveUserSecure(App.currentUser);
  sessionStorage.removeItem('bt_skip_login');
  hideLogin();
  updateSyncStatus('online');
  setUserDisplay(user.email || '用户');
  // 初始化 Realtime 订阅（为 baby-tracker 子页面预连接）
  subscribeRealtime(function() {});
  initRealtimeChannel();
}

// ==================== Realtime 空处理器（index 页不直接展示数据） ====================
function handleRealtimeChange() {}

// ==================== Service Worker 注册 ====================
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('/sw.js', { scope: '/' })
    .then(function(reg) {
      console.log('[PWA] SW 注册成功:', reg.scope);
    })
    .catch(function(err) {
      Logger.warn('PWA Service Worker 注册失败', err);
    });
}

// ==================== 初始化 ====================
async function init() {
  if (App._initCalled) return;
  App._initCalled = true;

  // 注册 Service Worker（PWA 离线支持）
  registerSW();

  initSupabase();

  var hasSession = await restoreSession();
  if (hasSession) {
    // 初始化 Realtime 订阅（为 baby-tracker 子页面预连接）
    subscribeRealtime(function() {});
    initRealtimeChannel();
    try {
      var refreshed = await refreshAccessToken();
      if (refreshed) {
        updateSyncStatus('online');
      } else {
        var tokenValid = await verifyAccessToken();
        if (tokenValid) {
          updateSyncStatus('online');
        } else {
          // token 刷新和验证都失败，保留 localStorage 信息，
          // 下次页面刷新时再尝试，不立即清除登录态
          updateSyncStatus('offline');
        }
      }
    } catch(e) {
      Logger.warn('初始化时 Token 刷新异常，标记离线', e);
      updateSyncStatus('offline');
    }
  } else {
    showLogin();
  }

  // 静默刷新 token 定时器 + 页面可见性监听
  scheduleTokenRefresh();
  setupVisibilityListener();
}

document.addEventListener('DOMContentLoaded', function() { init(); });
</script>
</body>
</html>
