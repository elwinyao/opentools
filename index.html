<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.sheetjs.com; connect-src 'self' https://jdlyqpvvfmsesdlicdbp.supabase.co wss://jdlyqpvvfmsesdlicdbp.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<!-- 预连接 Supabase API 和 WebSocket 域名，加速首次请求 -->
<link rel="preconnect" href="https://jdlyqpvvfmsesdlicdbp.supabase.co">
<link rel="dns-prefetch" href="https://jdlyqpvvfmsesdlicdbp.supabase.co">
<!-- 预加载 Supabase SDK（懒加载的 199KB 脚本，提前下载不阻塞渲染） -->
<link rel="preload" href="lib/supabase-js.min.js" as="script">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="成长助手">
<meta name="theme-color" content="#4472C4">
<link rel="manifest" href="manifest.json">
<title>🍼 宝宝成长助手</title>
<!-- 公共库（合并为单文件，减少 HTTP 请求） -->
<link rel="stylesheet" href="lib/common.css">
<link rel="stylesheet" href="index.css">
</head>
<body>

<div class="header">
  <h1>🍼 宝宝成长助手</h1>
  <div class="user-info" id="userInfo">
    <span id="userDisplay">📱 未登录</span>
    <button id="loginBtn" onclick="showLogin()">登录</button>
    <button id="logoutBtn" onclick="logout()" style="display:none">退出登录</button>
  </div>
</div>

<div class="container">
  <div class="welcome-card">
    <div class="welcome-icon">👶</div>
    <h2>欢迎使用宝宝成长助手</h2>
    <p>一站式记录宝宝日常作息，支持多设备云端同步</p>
  </div>

  <div class="entry-grid">
    <!-- 作息记录 -->
    <a href="baby-tracker/baby-tracker.html" class="entry-card card-baby">
      <div class="entry-icon">⏱️</div>
      <div class="entry-title">作息记录</div>
      <div class="entry-desc">记录喝奶、睡眠、玩耍、洗护等日常作息，查看时间轴与月度汇总</div>
    </a>
  </div>
</div>

<!-- 登录弹窗容器（兼容 iOS / 微信环境） -->
<div id="loginModalContainer" data-sub="登录后可在多设备同步数据"></div>
<!-- 保留旧标签兼容 -->
<login-modal sub="登录后可在多设备同步数据"></login-modal>

<!-- 公共库放在底部，避免阻塞 DOM 解析 -->
<script src="lib/common-bundle.js"></script>
<script>
// ==================== 入口页面逻辑 ====================

// ==================== UI 状态 ====================
function setUserDisplay(email) {
  document.getElementById('userDisplay').textContent = '👤 ' + email;
  document.getElementById('loginBtn').style.display = 'none';
  document.getElementById('logoutBtn').style.display = 'inline-block';
}

function clearUserDisplay() {
  document.getElementById('userDisplay').textContent = '📱 未登录';
  document.getElementById('loginBtn').style.display = 'inline-block';
  document.getElementById('logoutBtn').style.display = 'none';
}

function updateSyncStatus(status) {
  var el = document.getElementById('userDisplay');
  if (el && App.currentUser) {
    if (status === 'online') el.textContent = '👤 ' + App.currentUser.email;
    else if (status === 'syncing') el.textContent = '⏳ 同步中...';
    else el.textContent = '👤 ' + App.currentUser.email + ' (离线)';
  }
}

// ==================== 登录成功回调 ====================
async function onLoginSuccess(user, session) {
  App.currentUser.loginAt = Date.now();
  await saveUserSecure(App.currentUser);
  sessionStorage.removeItem('bt_skip_login');
  hideLogin();
  updateSyncStatus('online');
  setUserDisplay(user.email || '用户');
  // 初始化 Realtime 订阅（为 baby-tracker 子页面预连接）
  subscribeRealtime(function() {});
  initRealtimeChannel();
}

// ==================== 跳过登录回调 ====================
function onLoginSkip() {
  App.currentUser = null;
  clearUserSecure();
  sessionStorage.setItem('bt_skip_login', '1');
  updateSyncStatus('offline');
  clearUserDisplay();
}

// ==================== Realtime 空处理器（index 页不直接展示数据） ====================
function handleRealtimeChange() {}

// ==================== 初始化 ====================
async function init() {
  if (App._initCalled) return;
  App._initCalled = true;

  // 注册 Service Worker（PWA 离线支持）—— 异步不阻塞
  registerSW();

  // 初始化登录弹窗（兼容 iOS / 微信环境）
  var container = document.getElementById('loginModalContainer');
  LoginModalManager.init(container, {
    onSuccess: onLoginSuccess,
    onSkip: onLoginSkip
  });

  // 兼容旧的 Web Component 事件（如果浏览器支持 Custom Elements）
  var loginModal = document.querySelector('login-modal');
  if (loginModal && loginModal.addEventListener) {
    loginModal.addEventListener('login-success', function(e) {
      onLoginSuccess(e.detail.user, e.detail.session);
    });
    loginModal.addEventListener('login-skip', function() {
      onLoginSkip();
    });
  }

  await loadSupabaseSDK();
  initSupabase();

  // 会话恢复是核心路径，必须等待完成
  var sessionResult = await restoreSession();
  if (sessionResult.success) {
    setUserDisplay(App.currentUser.email || '用户');
    updateSyncStatus('online');

    // Realtime 和 token 刷新放到微任务中，不阻塞首屏渲染
    setTimeout(function() {
      subscribeRealtime(function() {});
      initRealtimeChannel();
      refreshAccessToken().then(function(refreshed) {
        if (refreshed) {
          updateSyncStatus('online');
        } else {
          verifyAccessToken().then(function(tokenValid) {
            updateSyncStatus(tokenValid ? 'online' : 'offline');
          }).catch(function() {
            updateSyncStatus('offline');
          });
        }
      }).catch(function(e) {
        Logger.warn('初始化时 Token 刷新异常，标记离线', e);
        updateSyncStatus('offline');
      });
    }, 0);
  } else {
    // 登录弹窗延迟显示，避免阻塞首屏
    setTimeout(function() {
      showLogin(sessionResult.reason === 'decrypt_failed' ? '安全升级，请重新登录' : '');
    }, 0);
  }

  // 静默刷新 token 定时器 + 页面可见性监听
  scheduleTokenRefresh();
  setupVisibilityListener();
}

document.addEventListener('DOMContentLoaded', function() { init(); });
</script>
</body>
</html>
